version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: digilib-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-digilib}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-digilib}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-digilib} -d ${POSTGRES_DB:-digilib}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  digilib-backend:
    image: ${DOCKERHUB_USERNAME}/digilib-backend:latest
    container_name: digilib-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-digilib}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-digilib}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRES_IN=${JWT_ACCESS_EXPIRES_IN:-15m}
      - JWT_REFRESH_EXPIRES_IN=${JWT_REFRESH_EXPIRES_IN:-7d}
      - AWS_REGION=${AWS_REGION}
      - AWS_BUCKET_NAME=${AWS_BUCKET_NAME}
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - FRONTEND_URL=${FRONTEND_URL}
      - FILE_STORAGE_PROVIDER=${FILE_STORAGE_PROVIDER:-s3}
      - NODE_ENV=production
      - PORT=3001

volumes:
  postgres_data:
